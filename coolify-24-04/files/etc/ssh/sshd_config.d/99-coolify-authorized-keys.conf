# Follow-up to #509 / MP-9232: keep first-boot localhost Validate trust, but do not
# write Coolify keys into /root/.ssh/authorized_keys (Vendor Portal img_check FAIL).
# Coolify trust lives here; DO/user keys stay in .ssh/authorized_keys.
# Match User root: only root consults this absolute path (avoids trusting it for
# every account).
Match User root
    AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/coolify
