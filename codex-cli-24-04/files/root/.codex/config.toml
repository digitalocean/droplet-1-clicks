# Pre-configured for DigitalOcean Serverless Inference.
# Set MODEL_ACCESS_KEY via droplet env, /opt/codex-cli.env, or /opt/setup-codex-cli.sh.
# Optional Intelligent Inference Router: set DO_INFERENCE_ROUTER=<name> to use
# model = "router:<name>" (same key).

model_provider = "openai_custom"
model = "openai-gpt-5.5"
model_catalog_json = "/root/.codex/inference-models.json"
preferred_auth_method = "apikey"
model_reasoning_effort = "high"
web_search = "disabled"

# Serverless Inference only accepts function tools over the Responses API (not tool_search
# or namespace-wrapped tools such as multi_agent).
[features]
tool_search = false
multi_agent = false

[model_providers.openai_custom]
name = "DigitalOcean Serverless Inference"
base_url = "https://inference.do-ai.run/v1"
env_key = "MODEL_ACCESS_KEY"
wire_api = "responses"
query_params = {}
