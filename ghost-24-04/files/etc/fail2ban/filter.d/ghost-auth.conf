[Definition]
# Ban failed admin sign-in only, not anonymous admin GETs (users/me, etc.).
# Ghost 6 logs wrong password as POST /session/ → 422 ValidationError
# with code PASSWORD_INCORRECT (not 401).
# JSON order: url, method, … x-forwarded-for / x-real-ip … statusCode … code
failregex = ^.*"url":"/session/"?,"method":"POST".*"x-forwarded-for":"<HOST>".*"code":"PASSWORD_INCORRECT"
            ^.*"url":"/session/"?,"method":"POST".*"x-real-ip":"<HOST>".*"code":"PASSWORD_INCORRECT"
ignoreregex =
