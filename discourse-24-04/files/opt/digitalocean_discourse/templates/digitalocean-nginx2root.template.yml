## DigitalOcean 1-Click: CVE-2026-123007 — belt-and-suspenders HTTP/2 disable in the container.
## Listed after web.ssl in discourse_docker samples (patched at image build).
run:
  - replace:
      filename: "/etc/nginx/conf.d/outlets/server/20-https.conf"
      from: /http2 on;/
      to: |
        http2 off;
  - replace:
      filename: "/etc/nginx/conf.d/outlets/server/20-https.conf"
      from: / ssl http2/
      to: |
        ssl
  - replace:
      filename: "/etc/nginx/conf.d/discourse.conf"
      from: /http2 on;/
      to: |
        http2 off;