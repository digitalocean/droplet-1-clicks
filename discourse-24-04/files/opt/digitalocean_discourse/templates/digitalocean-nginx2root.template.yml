## DigitalOcean 1-Click: CVE-2026-123007 — ensure Discourse nginx does not use HTTP/2 on TLS.
## Include after web.ssl / Lets Encrypt templates in containers/app.yml.
run:
  - replace:
      filename: "/etc/nginx/conf.d/discourse.conf"
      from: / ssl http2/
      to: |
        ssl
  - replace:
      filename: "/etc/nginx/conf.d/discourse.conf"
      from: /\[::\]:443 ssl http2/
      to: |
        [::]:443 ssl
  - exec:
      cmd:
        - |
          if nginx -v 2>&1 | grep -qE 'nginx/1\.(2[5-9]|[3-9][0-9]|[0-9]{2,})'; then
            if ! grep -q 'http2 off' /etc/nginx/nginx.conf 2>/dev/null; then
              sed -i '/^http {/a\    http2 off;' /etc/nginx/nginx.conf
            fi
          fi