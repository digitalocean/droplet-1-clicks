# Failed Caddy basic_auth (the public https:// desktop / "VNC" password).
# Only count 401s that sent an Authorization header: a bare visit always
# gets a 401 challenge before the browser prompts, and banning those would
# lock out legitimate users. The live Caddyfile redacts the header value
# so the password never lands in the access log.
# Match client_ip only (not also remote_ip) so one 401 cannot count twice.
[Definition]
failregex = ^\{.*"client_ip":"<HOST>".*"Authorization":.*"status":401\b
ignoreregex =
datepattern = "ts":{EPOCH}
