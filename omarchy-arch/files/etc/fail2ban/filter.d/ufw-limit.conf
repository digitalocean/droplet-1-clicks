# Sources that ufw's rate limiter has already started dropping on the RDP port.
#
# The Caddy jail this replaces could read failed passwords straight out of an
# access log. hypr-rdp has no equivalent: it writes nothing at all when it
# rejects credentials, verified at RUST_LOG=debug, so there is no auth event to
# count. What it does leak is connection volume, and that is a faithful proxy,
# because RDP network level authentication rejects a wrong password by dropping
# the connection: one guess costs one new TCP connection.
#
# So `ufw limit 3389/tcp` does the counting in the kernel (more than 6 new
# connections from one source in 30 seconds) and logs each drop; this filter
# turns those drops into fail2ban hits, which is what applies the escalating
# ban. The DPT anchor keeps the jail from reacting to limited ports added later.
#
# Matched against the journal's kernel transport, so fail2ban takes the
# timestamp from the journal and no datepattern is needed here.
[Definition]
failregex = ^(?:.*\s)?\[UFW LIMIT BLOCK\]\s.*\bSRC=<HOST>\b.*\bDPT=3389\b
ignoreregex =
