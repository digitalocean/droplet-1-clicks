---
# kafka_version and kafka_sha512 are set only by Packer from template.json:
#   --extra-vars kafka_version={{user `application_version`}} kafka_sha512={{user `kafka_sha512`}}
# Do not pin a Kafka version or digest here.
kafka_scala_version: "2.13"

data_dir: /var/lib/kafka
log_dir: /var/log/kafka
kafka_dir: "/opt/kafka"
templates_dir: "{{ kafka_dir }}/do-templates"

# Current releases live on downloads.apache.org; older ones move to the archive.
kafka_mirror: https://downloads.apache.org/kafka
kafka_archive_mirror: https://archive.apache.org/dist/kafka
kafka_artifact: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka_url: "{{ kafka_mirror }}/{{ kafka_version }}/{{ kafka_artifact }}"
kafka_archive_url: "{{ kafka_archive_mirror }}/{{ kafka_version }}/{{ kafka_artifact }}"
